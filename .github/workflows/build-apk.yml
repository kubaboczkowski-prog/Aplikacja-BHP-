          PYANDROID

      - name: Zainstaluj JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Skonfiguruj Android SDK
        uses: android-actions/setup-android@v3

      - name: Dodaj Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Skonfiguruj Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Skompiluj APK Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Udostepnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: EPICHEM-BHP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
